[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ccledger"
version = "0.3.0"
description = "Account for what Claude Code actually consumed - reads local session transcripts, counts subagent work, keeps cache tiers apart."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zkm00323" }]
keywords = [
    "claude",
    "claude-code",
    "anthropic",
    "token-usage",
    "cost-tracking",
    "llm",
    "cli",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zkm00323/ccledger"
Source = "https://github.com/zkm00323/ccledger"
Issues = "https://github.com/zkm00323/ccledger/issues"

[project.scripts]
ccledger = "ccledger:main"

[tool.setuptools]
py-modules = ["ccledger"]
